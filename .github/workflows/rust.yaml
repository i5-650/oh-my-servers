name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION_STABLE: 1.90.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION_STABLE }}
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -Dclippy::correctness -Dclippy::complexity -Wclippy::perf -Wclippy::pedantic
      - name: Test
        run: cargo test
